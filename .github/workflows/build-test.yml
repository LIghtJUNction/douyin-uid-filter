name: Build and test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Install SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Observe runtime repository HTTP status
        run: |
          set -euo pipefail
          artifact='org/robolectric/android-all-instrumented/15-robolectric-12650502-i7/android-all-instrumented-15-robolectric-12650502-i7.pom'
          for repository in https://repo1.maven.org/maven2 https://repo.maven.apache.org/maven2; do
            curl --silent --show-error --location --max-time 20 --output /dev/null \
              --write-out "$repository POM HTTP %{http_code}\n" "$repository/$artifact" || true
          done
      - name: Test and build without release signing
        run: |
          set -euo pipefail
          test -z "${ANDROID_KEYSTORE_PATH:-}"
          python3 -m unittest discover -s scripts -p 'test_bump_version.py' -v
          gradle --no-daemon --console=plain test assembleDebug assembleRelease lintRelease
      - name: Record complete test outcomes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for variant in ['testDebugUnitTest', 'testReleaseUnitTest']:
              reports = list(Path('app/build/test-results', variant).glob('TEST-*.xml'))
              suites = [E.parse(p).getroot() for p in reports]
              print(variant, {k: sum(int(s.get(k, 0)) for s in suites)
                    for k in ['tests', 'failures', 'errors', 'skipped']}, flush=True)
              for suite in suites:
                  for failure in suite.iter('failure'):
                      print(failure.text, flush=True)
                  for error in suite.iter('system-err'):
                      print(error.text or '', flush=True)
          PY
