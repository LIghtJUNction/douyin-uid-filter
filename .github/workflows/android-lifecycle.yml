name: Android synthetic lifecycle

on:
  push:
    branches: ['fix/restart-configuration-diagnostics']
    paths: ['.github/workflows/android-lifecycle.yml', 'tests/android-lifecycle/**']

permissions:
  contents: read

concurrency:
  group: android-synthetic-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Check supported KVM and install SDK
        shell: bash
        run: |
          set -euo pipefail
          test -r /dev/kvm && test -w /dev/kvm || {
            echo 'Runner KVM is unavailable; refusing unsupported software emulation.' >&2
            exit 1
          }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'emulator' 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' \
            'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Build product and independent disposable test APKs
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain test assembleDebug lintDebug
          python3 tests/android-lifecycle/build-fixtures.py
      - name: Start isolated Android system
        shell: bash
        run: |
          set -euo pipefail
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name lifecycle --package 'system-images;android-35;default;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd lifecycle -port 5554 -accel on \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader \
            -memory 2048 > artifacts/android-lifecycle/emulator.log 2>&1 &
          echo "$!" > artifacts/android-lifecycle/emulator.pid
      - name: Observe real-system lifecycle matrix
        run: timeout 10m python3 tests/android-lifecycle/run-matrix.py
      - name: Record bounded evidence and stop emulator
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/android-lifecycle/report.json ]]; then
            cat artifacts/android-lifecycle/report.json
            echo '### Synthetic Android lifecycle (not Douyin/Xposed)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/android-lifecycle/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f artifacts/android-lifecycle/emulator.log ]]; then
            tail -n 60 artifacts/android-lifecycle/emulator.log
          fi
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
