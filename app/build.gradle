plugins { id 'com.android.application' }

def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }
def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')

// Resolve the API 35 test runtime once through Gradle, rather than Robolectric's
// independent downloader (which retries separately for every test on HTTP 429).
def robolectricRuntime = configurations.create('robolectricRuntime') {
    canBeConsumed = false
    canBeResolved = true
}
def runtimeDirectory = layout.buildDirectory.dir('robolectric-runtime')
def prepareRobolectricRuntime = tasks.register('prepareRobolectricRuntime', Sync) {
    from robolectricRuntime
    into runtimeDirectory
}

android {
    namespace 'io.github.lightjunction.douyinuidfilter'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.lightjunction.douyinuidfilter'
        minSdk 27
        targetSdk 35
        versionCode releaseVersion.getProperty('VERSION_CODE').toInteger()
        versionName releaseVersion.getProperty('VERSION_NAME')
    }
    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (signingPath) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        aidl true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn prepareRobolectricRuntime
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', runtimeDirectory.get().asFile.absolutePath
        }
    }
    lint { abortOnError true }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Matches Robolectric 4.14.1's instrumented Android 15 / API 35 runtime.
    add('robolectricRuntime', 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7')
}
